<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Matcher</title>
<style>
        .button {
            background-color: blue;
            border-radius: 10px;
            padding: 4px 8px;
            color: white;
            margin-top: 8px;
            display: block;
            width: 50px;
            cursor: pointer;
            transition: all .25s ease-out;
            text-align: center;
            font-size: 14px;
        }

        .button:hover {
            background-color: cyan;
            font-size: 16px;
        }

        .container {
            width: 500px;
            margin: 0 auto;
        }

        .meal-thumbnail{
            width: 100px;
            height: 100px;
        }

        .meal {
            max-width: 100px;
            margin-bottom: 16px;
            border-radius: 8px;
            padding: 8px;
        }
        .result {
            display: flex;
            flex-direction: row;
            align-items: center;
            flex-flow: row wrap;
            gap: 16px;          
        }

        .meal:hover {
            background-color: #f0f0f0;
            cursor: pointer;
        }
        
        .recipe { 
            margin-bottom: 16px;
        }
    </style>

</head>
<body>
    <div class="container">

        <h1>Recipe Matcher</h1>
        <p>Match recipies with your ingredients</p>
        
        <!-- input to collect user's ingredients -->
        <input
        name="ingredients"
        class="ingredients-input"
        type="text"
        placeholder="eggs, milk, etc."
        />

        <span
            class="button"
        >
            Submit
        </span>

        <p class="recipeText">Recipe:</p>
        <div class="recipeContainer"></div>

        <p class="resultText">Results:</p>
        <div class="result">
            

        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
